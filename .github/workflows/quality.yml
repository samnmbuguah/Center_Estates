name: Quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests with coverage gate
        run: |
          coverage run manage.py test audit companion construction core documents facilities notifications organizations properties sales subscriptions tenders valuations
          coverage report
          coverage xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Run frontend unit and component tests with coverage gate
        run: npm run test:coverage -- --silent
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Enforce frontend bundle budgets
        working-directory: .
        run: node scripts/check_frontend_bundles.mjs
