name: Live acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1-5"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ROLE_PASSWORD: ${{ secrets.E2E_ROLE_PASSWORD }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require acceptance configuration
        run: test -n "$E2E_BASE_URL" && test -n "$E2E_ADMIN_PASSWORD"
      - name: Wait for deployment readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$E2E_BASE_URL/api/v1/health/" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Core Property, Facility and Companion role gate
        run: >-
          npx playwright test tests/e2e/core-roles.spec.ts tests/e2e/roles.spec.ts
          --grep 'portfolio manager|operations staff|finance officer reaches|read-only role|ROLE-(PROPERTY|LEASING|FACILITY|COMPANION)'
          --project=desktop-chromium --workers=1
      - name: Full browser acceptance suite
        run: npx playwright test
      - name: Publish acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-acceptance-${{ github.run_id }}
          path: |
            artifacts/playwright-report
            artifacts/playwright-results.xml
            artifacts/test-results
          if-no-files-found: warn
          retention-days: 30
      - name: Post CI results to the readiness hub
        if: always() && env.E2E_ADMIN_PASSWORD != ''
        run: |
          # Parse the JUnit XML to extract spec counts.
          XML="artifacts/playwright-results.xml"
          if [ -f "$XML" ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' "$XML" | head -1)
            FAILED=$(grep -oP 'failures="\K[0-9]+' "$XML" | head -1)
            PASSED=$((TOTAL - FAILED))
          else
            TOTAL=0; FAILED=0; PASSED=0
          fi
          if [ "$FAILED" -gt 0 ]; then
            CONCLUSION="failure"
          elif [ "$TOTAL" -gt 0 ]; then
            CONCLUSION="success"
          else
            CONCLUSION="unknown"
          fi
          SHA="${GITHUB_SHA::12}"
          # Authenticate with the application API.
          CSRF_URL="${E2E_BASE_URL}/api/v1/auth/csrf/"
          curl -sf -c /tmp/ci-cookies.txt "$CSRF_URL" >/dev/null 2>&1 || true
          curl -sf -c /tmp/ci-cookies.txt -b /tmp/ci-cookies.txt \
            -X POST "${E2E_BASE_URL}/api/v1/auth/login/" \
            -H "Content-Type: application/json" \
            -H "Referer: ${E2E_BASE_URL}/" \
            -d "{\"username\":\"admin\",\"password\":\"${E2E_ADMIN_PASSWORD}\"}" >/dev/null
          CSRF_TOKEN=$(grep csrftoken /tmp/ci-cookies.txt | awk '{print $NF}')
          # Push the summary to the application.
          curl -sf -b /tmp/ci-cookies.txt \
            -X POST "${E2E_BASE_URL}/api/v1/testing/ci-results/" \
            -H "Content-Type: application/json" \
            -H "X-CSRFToken: ${CSRF_TOKEN}" \
            -d "{
              \"run_number\": ${GITHUB_RUN_NUMBER},
              \"conclusion\": \"${CONCLUSION}\",
              \"total_specs\": ${TOTAL},
              \"passed_specs\": ${PASSED},
              \"failed_specs\": ${FAILED},
              \"head_sha\": \"${SHA}\",
              \"run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",
              \"branch\": \"${GITHUB_REF_NAME}\"
            }" >/dev/null || echo "Warning: Could not post CI results to the readiness hub."
