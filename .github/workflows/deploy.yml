name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity=1

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Enforce frontend bundle budgets
        working-directory: .
        run: node scripts/check_frontend_bundles.mjs

  deploy:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /root/Dev/Center_Estates
            git pull origin main
            docker compose build web backend
            docker compose up -d web backend
            docker compose ps

  # Post-deploy smoke gate: a fast Playwright subset that proves the deployed
  # site can be signed into and that every advertised module still opens. Skips
  # cleanly when acceptance configuration is absent.
  smoke:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.E2E_BASE_URL != ''
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for deployment readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$E2E_BASE_URL/api/v1/health/" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Post-deploy smoke gate
        run: npx playwright test --grep @smoke --project=desktop-chromium --workers=1
      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: |
            artifacts/playwright-report
            artifacts/playwright-results.xml
            artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
